name: Build DirectX 12 Samples

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build D3D12HelloWorld Solution
      run: msbuild "Samples\Desktop\D3D12HelloWorld\D3D12HelloWorld.sln" /p:Configuration=Release /p:Platform=x64

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: D3D12HelloWorld-Binaries
        path: Samples\Desktop\D3D12HelloWorld\bin\x64\Release\
