name: Build DirectX 12 Samples

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore "Samples\Desktop\D3D12HelloWorld\src\D3D12HelloWorld.sln"

    - name: Build D3D12HelloWorld Solution
      continue-on-error: true
      run: msbuild "Samples\Desktop\D3D12HelloWorld\src\D3D12HelloWorld.sln" /p:Configuration=Release /p:Platform=x64

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: D3D12HelloWorld-Binaries
        path: |
          Samples/Desktop/D3D12HelloWorld/src/**/bin/x64/Release/*.exe
          Samples/Desktop/D3D12HelloWorld/src/**/bin/x64/Release/*.dll
